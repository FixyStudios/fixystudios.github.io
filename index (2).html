<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriLinked Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,350..700;1,9..144,350..600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0d1020;
            --text: #f6f1e7;
            --oot-glow: #f4c677;
            --mm-ember: #e8803a;
            --frame-w: min(100%, max(280px, calc((100dvh - 210px) * 1.3333)));
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--ink);
            color: var(--text);
            font-family: 'Instrument Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Barra superior ---------- */
        .topbar {
            position: absolute; inset: 0 0 auto 0; z-index: 20;
            display: flex; align-items: center; gap: 10px;
            padding: 22px 28px; pointer-events: none;
        }
        .triforce { width: 26px; height: 23px; fill: var(--oot-glow); }
        .brand { font-family: 'Fraunces', Georgia, serif; font-size: 1.35rem; font-weight: 650; letter-spacing: .01em; }
        .brand em { font-weight: 350; font-style: italic; opacity: .85; }

        /* ---------- Menu: duas metades ---------- */
        #menu { display: flex; min-height: 100dvh; }
        .panel {
            --accent: var(--oot-glow);
            position: relative; flex: 1 1 0; min-width: 0; overflow: hidden;
            display: flex; align-items: flex-end; cursor: pointer;
            background: #101528;
            transition: flex-grow .6s cubic-bezier(.2, .7, .2, 1);
        }
        .panel[data-game="mm"] { --accent: var(--mm-ember); }
        .panel + .panel { border-left: 1px solid rgba(255,255,255,.16); }
        @media (hover: hover) and (min-width: 721px) {
            .panel:hover, .panel:focus-within { flex-grow: 1.45; }
            .panel:hover .scene, .panel:focus-within .scene { transform: scale(1.04); }
        }
        .scene { position: absolute; inset: 0; z-index: 0; transition: transform .8s cubic-bezier(.2, .7, .2, 1); }
        .scene svg { width: 100%; height: 100%; display: block; }
        .scrim {
            position: absolute; inset: 0; z-index: 0;
            background: linear-gradient(to top, rgba(7,9,18,.9) 0%, rgba(7,9,18,.5) 36%, transparent 62%);
        }
        .panel-body {
            position: relative; z-index: 2; width: 100%;
            padding: 0 clamp(24px, 4vw, 56px) clamp(32px, 7vh, 72px);
        }
        .panel h2 {
            font-family: 'Fraunces', Georgia, serif; font-weight: 600;
            font-size: clamp(2.1rem, 4.6vw, 4.2rem); line-height: 1.02;
            margin: 0 0 .3em; text-wrap: balance;
            font-variation-settings: "opsz" 144;
        }
        .meta { margin: 0 0 16px; color: rgba(246,241,231,.78); font-size: .95rem; }
        .rom { display: flex; align-items: center; gap: 8px; margin: 0 0 22px; font-size: .9rem; color: rgba(246,241,231,.85); }
        .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.6); }
        .panel.has-rom .dot { background: var(--accent); border-color: var(--accent); }
        .actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
        .play {
            background: var(--accent); color: #1a1206; border: none; cursor: pointer;
            padding: 13px 30px; border-radius: 999px;
            font: 600 1rem 'Instrument Sans', system-ui, sans-serif;
            transition: transform .15s;
        }
        .play:hover { transform: translateY(-2px); }
        .play:focus-visible, .forget:focus-visible, .back-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        .forget {
            background: none; border: none; padding: 4px 0; cursor: pointer;
            color: rgba(246,241,231,.65); font: 400 .85rem 'Instrument Sans', system-ui, sans-serif;
            text-decoration: underline; text-underline-offset: 3px;
        }
        .forget:hover { color: #fff; }

        /* Um único momento de movimento: o sol sobe e a lua desce ao abrir */
        @keyframes rise { from { transform: translateY(90px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes sink { from { transform: translateY(-70px); opacity: 0; } to { transform: none; opacity: 1; } }
        .sun  { animation: rise 1.9s cubic-bezier(.2, .7, .2, 1) both; }
        .moon { animation: sink 1.9s cubic-bezier(.2, .7, .2, 1) both; }

        /* Aviso */
        #msg {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
            max-width: 90vw; text-align: center;
            background: rgba(10,12,22,.92); border: 1px solid rgba(255,255,255,.22);
            padding: 10px 20px; border-radius: 999px; font-size: .92rem;
        }
        #msg:empty { display: none; }
        input[type="file"] { display: none; }

        /* ---------- Tela do jogo ---------- */
        body[data-game="oot"] { --accent: var(--oot-glow); --stage: linear-gradient(180deg, #16315a 0%, #2d6045 100%); }
        body[data-game="mm"]  { --accent: var(--mm-ember); --stage: linear-gradient(180deg, #120a2a 0%, #4a1f5e 70%, #7a2d4a 100%); }
        #gameScreen {
            display: none; min-height: 100dvh; padding: 84px 20px 32px;
            flex-direction: column; align-items: center; gap: 16px;
            background: var(--stage);
        }
        .stage-head { width: var(--frame-w); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .stage-title { font-family: 'Fraunces', Georgia, serif; font-size: 1.6rem; font-weight: 600; margin: 0; }
        .back-btn {
            background: transparent; color: var(--text); cursor: pointer;
            border: 1.5px solid var(--accent); border-radius: 999px; padding: 8px 18px;
            font: 500 .9rem 'Instrument Sans', system-ui, sans-serif; white-space: nowrap;
        }
        .back-btn:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
        .frame {
            width: var(--frame-w); aspect-ratio: 4 / 3; background: #000; overflow: hidden;
            border: 3px solid var(--accent); border-radius: 8px;
            box-shadow: 0 18px 60px rgba(0,0,0,.5), 0 0 0 8px rgba(255,255,255,.05);
        }
        #game { width: 100%; height: 100%; }
        .hint { margin: 0; width: var(--frame-w); color: rgba(246,241,231,.72); font-size: .88rem; }

        /* ---------- Celular ---------- */
        @media (max-width: 720px) {
            #menu { flex-direction: column; }
            .panel { min-height: 50dvh; }
            .panel + .panel { border-left: none; border-top: 1px solid rgba(255,255,255,.16); }
            .topbar { padding: 16px 20px; }
            .panel-body { padding-bottom: 28px; }
            .panel h2 { font-size: clamp(1.9rem, 8vw, 2.6rem); }
        }
        @media (prefers-reduced-motion: reduce) {
            .sun, .moon { animation: none; }
            .panel, .scene, .play { transition: none; }
        }
    </style>
</head>
<body>

<div class="topbar">
    <svg class="triforce" viewBox="0 0 100 90" aria-hidden="true"><polygon points="50,4 72,43 28,43"/><polygon points="6,86 28,48 50,86"/><polygon points="50,86 72,48 94,86"/></svg>
    <span class="brand">TriLinked <em>Games</em></span>
</div>

<!-- ================= MENU ================= -->
<main id="menu" aria-label="Escolha seu jogo">

                    </linearGradient>

                        <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#fde7a8" stop-opacity=".85"/><stop offset="1" stop-color="#f4c677" stop-opacity="0"/>
                    </radialGradient>

                <path d="M0 650 L90 570 L170 630 L260 530 L350 620 L440 550 L520 610 L600 570 V900 H0Z" fill="#8a6f92"/>
                <path d="M0 705 C120 655 220 695 320 665 S520 645 600 685 V900 H0Z" fill="#3f7a54"/>
                <g fill="#1f3f33">
                    <polygon points="372,640 410,612 448,640"/>
                    <rect x="378" y="640" width="64" height="30"/>
                </g>
                <g fill="#3f7a54"><rect x="386" y="648" width="5" height="22"/><rect x="400" y="648" width="5" height="22"/><rect x="414" y="648" width="5" height="22"/><rect x="428" y="648" width="5" height="22"/></g>
                <path d="M0 765 C140 725 260 775 380 745 S540 725 600 755 V900 H0Z" fill="#2d6045"/>
                <g fill="#173528">
                    <rect x="92" y="722" width="6" height="34"/><circle cx="95" cy="712" r="22"/>
                    <rect x="506" y="728" width="6" height="30"/><circle cx="509" cy="718" r="18"/>
                </g>

            </svg>
        </div>
        <div class="scrim"></div>
        <div class="panel-body">
            <h2 id="t-oot">Ocarina of Time</h2>
            <p class="meta">Nintendo 64, 1998</p>
            <p class="rom"><span class="dot"></span><span class="rom-text">Sem ROM neste navegador</span></p>
            <div class="actions">
                <button class="play" type="button" aria-label="Jogar Ocarina of Time">Jogar</button>
                <button class="forget" type="button" hidden>Remover ROM salva</button>
            </div>
        </div>
    </section>

    <section class="panel" data-game="mm" aria-labelledby="t-mm">
        <div class="scene">
            <svg viewBox="0 0 600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
                <defs>
                    <linearGradient id="mmSky" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#120a2a"/><stop offset=".45" stop-color="#4a1f5e"/><stop offset=".75" stop-color="#b2425a"/><stop offset="1" stop-color="#e8803a"/>
                    </linearGradient>
                    <radialGradient id="mmMoon" cx=".4" cy=".35" r=".8">
                        <stop offset="0" stop-color="#f6ebc2"/><stop offset="1" stop-color="#c2ad78"/>
                    </radialGradient>
                    <radialGradient id="mmHalo">
                        <stop offset=".55" stop-color="#e8803a" stop-opacity=".38"/><stop offset="1" stop-color="#e8803a" stop-opacity="0"/>
                    </radialGradient>
                </defs>
                <rect width="600" height="900" fill="url(#mmSky)"/>
                <g fill="#fff" opacity=".6">
                    <circle cx="60" cy="110" r="1.4"/><circle cx="150" cy="60" r="1.8"/><circle cx="520" cy="90" r="1.5"/>
                    <circle cx="560" cy="210" r="1.2"/><circle cx="40" cy="260" r="1.2"/><circle cx="470" cy="40" r="1.2"/>
                </g>
                <g class="moon">
                    <circle cx="300" cy="330" r="290" fill="url(#mmHalo)"/>
                    <circle cx="300" cy="330" r="170" fill="url(#mmMoon)"/>
                    <g fill="#a38c58" opacity=".45">
                        <circle cx="250" cy="280" r="28"/><circle cx="352" cy="238" r="18"/><circle cx="332" cy="356" r="34"/>

                    </g>
                    <path d="M262 168 L292 240 L268 296 L322 356" fill="none" stroke="#7a2d5a" stroke-width="3" opacity=".5" stroke-linejoin="round"/>
                </g>
                <path d="M0 790 L40 790 L40 765 L80 745 L120 765 L120 800 L170 800 L170 775 L215 775 L215 815 L250 815 L250 840 L350 840 L350 815 L385 815 L385 780 L430 780 L430 760 L470 740 L510 760 L510 800 L560 800 L560 780 L600 780 V900 H0Z" fill="#0b0618"/>
                <g fill="#f3b04c">
                    <rect x="58" y="778" width="6" height="8"/><rect x="95" y="778" width="6" height="8"/><rect x="184" y="788" width="6" height="8"/>
                    <rect x="398" y="792" width="6" height="8"/><rect x="452" y="776" width="6" height="8"/><rect x="488" y="776" width="6" height="8"/>
                </g>
                <g transform="translate(160 0)"><rect x="272" y="590" width="56" height="270" fill="#0b0618"/>
                <polygon points="262,590 300,538 338,590" fill="#0b0618"/>
                <circle cx="300" cy="628" r="19" fill="#f0e2b4"/>
                <g stroke="#0b0618" stroke-width="2" stroke-linecap="round"><line x1="300" y1="628" x2="300" y2="614"/><line x1="300" y1="628" x2="311" y2="633"/></g></g>
                <path d="M0 845 L90 845 L90 825 L150 825 L150 850 L260 850 L260 870 L340 870 L340 850 L450 850 L450 830 L520 830 L520 850 L600 850 V900 H0Z" fill="#070312"/>
            </svg>
        </div>
        <div class="scrim"></div>
        <div class="panel-body">

            <div class="actions">

</main>

<!-- ================= EMULADOR ================= -->
<section id="gameScreen" aria-label="Emulador">
    <div class="stage-head">
        <h2 class="stage-title" id="stageTitle"></h2>
        <button class="back-btn" id="backBtn" type="button">Trocar de jogo</button>
    </div>
    <div class="frame"><div id="game"></div></div>
    <p class="hint">Controles: abra o menu do emulador (ícone de engrenagem) e use Control Settings.</p>
</section>

<p id="msg" role="status" aria-live="polite"></p>
<input type="file" id="romInput" accept=".z64,.n64,.v64">

<script>
    /* ---------- Catálogo de jogos ---------- */
    const GAMES = {
        oot: { name: 'Ocarina of Time', defaultRom: 'ocarina_of_time.z64', codePrefix: 'NZL' },
        mm:  { name: "Majora’s Mask",   defaultRom: 'majoras_mask.z64',    codePrefix: 'NUC' }
    };

    const DB_NAME = 'trilinked', STORE = 'roms';
    const msgEl = document.getElementById('msg');
    const romInput = document.getElementById('romInput');
    let started = false;
    let pendingGame = null;

    function setMsg(text) { msgEl.textContent = text || ''; }

    /* ---------- IndexedDB: uma ROM por jogo, só neste navegador ---------- */
    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = () => req.result.createObjectStore(STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function saveRom(id, file) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put({ blob: file, name: file.name }, id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }
    async function getSavedRom(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const req = db.transaction(STORE).objectStore(STORE).get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
        });
    }
    async function clearSavedRom(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(id);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    /* ---------- Menu ---------- */
    async function refreshPanel(id) {
        const panel = document.querySelector('.panel[data-game="' + id + '"]');
        let saved = null;
        try { saved = await getSavedRom(id); } catch (err) { /* IndexedDB indisponível */ }
        panel.classList.toggle('has-rom', !!saved);
        panel.querySelector('.rom-text').textContent = saved ? 'ROM salva neste navegador' : 'Sem ROM neste navegador';
        panel.querySelector('.forget').hidden = !saved;
    }

    document.querySelectorAll('.panel').forEach((panel) => {
        const id = panel.dataset.game;
        panel.addEventListener('click', () => playGame(id));
        panel.querySelector('.forget').addEventListener('click', async (e) => {
            e.stopPropagation();
            try { await clearSavedRom(id); } catch (err) { console.warn(err); }
            setMsg('ROM de ' + GAMES[id].name + ' removida deste navegador.');
            refreshPanel(id);
        });
        refreshPanel(id);
    });

    /* ---------- Fluxo ao escolher um jogo ---------- */
    async function playGame(id) {
        if (started) return;
        const g = GAMES[id];
        setMsg('Procurando a ROM de ' + g.name + '...');

        // 1) ROM já salva no navegador
        try {
            const saved = await getSavedRom(id);
            if (saved && saved.blob) {
                startEmulator(id, URL.createObjectURL(saved.blob));
                return;
            }
        } catch (err) { console.warn('IndexedDB indisponível:', err); }

        // 2) Arquivo na mesma pasta (só funciona via http, não file://)
        if (location.protocol !== 'file:') {
            try {
                const r = await fetch(g.defaultRom, { method: 'HEAD' });
                if (r.ok) { startEmulator(id, g.defaultRom); return; }
            } catch (err) { /* segue para seleção manual */ }
        }

        // 3) Seleção manual
        pendingGame = id;
        setMsg('Selecione a ROM de ' + g.name + '. Ela ficará salva neste navegador.');
        romInput.click();
    }

    // Confere o cabeçalho de ROMs .z64 (big-endian) para ver se é do jogo certo
    async function looksLikeGame(file, id) {
        try {
            const b = new Uint8Array(await file.slice(0, 0x40).arrayBuffer());
            const isZ64 = b[0] === 0x80 && b[1] === 0x37 && b[2] === 0x12 && b[3] === 0x40;
            if (!isZ64) return true;
            return String.fromCharCode(b[0x3B], b[0x3C], b[0x3D]) === GAMES[id].codePrefix;
        } catch (e) { return true; }
    }

    romInput.addEventListener('cancel', () => { pendingGame = null; setMsg(''); });
    romInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file || !pendingGame) return;
        const id = pendingGame;
        pendingGame = null;

        if (!(await looksLikeGame(file, id))) {
            if (!confirm('Esse arquivo não parece ser de ' + GAMES[id].name + '. Usar mesmo assim?')) {
                setMsg('');
                return;
            }
        }
        try { await saveRom(id, file); } catch (err) { console.warn('Não foi possível salvar a ROM:', err); }
        startEmulator(id, URL.createObjectURL(file));
    });

    /* ---------- Emulador ---------- */
    function startEmulator(id, romUrl) {
        if (started) return;
        started = true;
        setMsg('');
        document.body.dataset.game = id;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        document.getElementById('stageTitle').textContent = GAMES[id].name;
        document.title = 'TriLinked Games | ' + GAMES[id].name;

        window.EJS_player = '#game';
        window.EJS_core = 'n64';
        window.EJS_gameUrl = romUrl;
        window.EJS_gameName = GAMES[id].name;
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;

        const s = document.createElement('script');
        s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        s.onerror = () => {
            alert('Não foi possível carregar o emulador. Verifique sua conexão com a internet.');
            location.reload();
        };
        document.body.appendChild(s);
    }

    // O EmulatorJS roda uma instância por página; recarregar volta ao menu
    document.getElementById('backBtn').addEventListener('click', () => location.reload());
</script>

</body>
</html>
